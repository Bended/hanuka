<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Hanukkah Sufganiyot Order</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: single centered column of flavor rows, sticky order bar pinned to the bottom */
:root {
  --bg: #f6f4fb;
  --surface: #ffffff;
  --ink: #1c1a3a;
  --muted: #646083;
  --line: #e2def0;
  --accent: #2f3fbf;      /* Hanukkah blue */
  --accent-ink: #ffffff;
  --gold: #e3a32a;        /* fried dough / candle flame */
  --wa: #1f9d55;          /* WhatsApp green */
  --wa-ink: #ffffff;
  --dough: #d99a4e;
  --dough-dark: #b8742e;
  --font-display: "Rubik", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12112a; --surface: #1c1b3a; --ink: #f1effa; --muted: #a9a5c8; --line: #2f2d55;
    --accent: #8d9bff; --accent-ink: #12112a; --gold: #f0b94a; --wa: #34c46e; --wa-ink: #0d1f14;
    --dough: #c98a40; --dough-dark: #a2672a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12112a; --surface: #1c1b3a; --ink: #f1effa; --muted: #a9a5c8; --line: #2f2d55;
  --accent: #8d9bff; --accent-ink: #12112a; --gold: #f0b94a; --wa: #34c46e; --wa-ink: #0d1f14;
  --dough: #c98a40; --dough-dark: #a2672a; color-scheme: dark;
}
html[lang="he"] { --font-body: "Rubik", system-ui, -apple-system, sans-serif; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 140px;
  display: flex; flex-direction: column; gap: 24px;
}

header { display: flex; flex-direction: column; gap: 8px; }
.top-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.candles { display: flex; gap: 6px; align-items: flex-end; height: 34px; direction: ltr; }
.candles span {
  width: 6px; height: 20px; background: var(--accent); border-radius: 2px; position: relative;
}
.candles span::before {
  content: ""; position: absolute; left: 50%; top: -11px; width: 7px; height: 10px;
  transform: translateX(-50%); background: var(--gold); border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
}
.candles span.shamash { height: 28px; margin-inline: 4px; }

.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); direction: ltr; }
.lang button {
  font: 600 13px var(--font-display); color: var(--muted); background: none; border: 0;
  padding: 5px 10px 5px 7px; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.lang .flag {
  width: 21px; height: 14px; border-radius: 3px; flex: none;
  box-shadow: 0 0 0 1px rgba(0,0,0,.15);
}
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 7vw, 38px);
  line-height: 1.1; margin: 0; text-wrap: balance;
}
.sub { margin: 0; color: var(--muted); max-width: 46ch; }
.price-tag {
  align-self: flex-start; font-family: var(--font-display); font-weight: 700;
  background: var(--gold); color: #2a1a00; padding: 4px 12px; border-radius: 999px; font-size: 14px;
}

.list { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.item {
  display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px;
  transition: border-color .15s;
}
.item.on { border-color: var(--accent); }
.info { min-width: 0; }
.name { font-family: var(--font-display); font-weight: 700; font-size: 17px; margin: 0; }
.desc { margin: 0; color: var(--muted); font-size: 13px; }

/* donut drawing */
.donut {
  width: 64px; height: 64px; border-radius: 50%; position: relative;
  background: radial-gradient(circle at 35% 30%, var(--dough) 0 55%, var(--dough-dark) 100%);
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.12);
}
.donut .band {
  position: absolute; inset: 26px 0 auto; height: 8px; background: rgba(255,240,215,.55); border-radius: 4px;
}
.donut .top {
  position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
  width: 34px; height: 18px; border-radius: 50% 50% 45% 45%; background: var(--glaze);
}
.donut .top.dollop { width: 18px; height: 14px; top: 2px; border-radius: 50%; }
.donut .sugar {
  position: absolute; inset: 0; border-radius: 50%;
  background-image: radial-gradient(rgba(255,255,255,.9) 1px, transparent 1.5px);
  background-size: 6px 6px; opacity: .55;
}

.stepper { display: flex; align-items: center; gap: 6px; direction: ltr; }
.stepper button {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font-size: 20px; line-height: 1; cursor: pointer;
  display: grid; place-items: center; font-family: var(--font-body);
}
.stepper button.plus { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stepper button:disabled { opacity: .35; cursor: default; }
button:focus-visible, .field input:focus-visible, .field textarea:focus-visible, .order:focus-visible {
  outline: 3px solid var(--gold); outline-offset: 2px;
}
.qty {
  width: 28px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 18px;
  font-variant-numeric: tabular-nums;
}

.details { display: flex; flex-direction: column; gap: 12px; }
.details h2 { font-family: var(--font-display); font-size: 18px; margin: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%;
}
.field textarea { min-height: 70px; resize: vertical; }
.field textarea.preview { min-height: 180px; font-size: 14px; background: var(--bg); }
.copy-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.copy {
  font: 600 14px var(--font-body); color: var(--accent); background: var(--surface);
  border: 1px solid var(--accent); border-radius: 999px; padding: 8px 16px; cursor: pointer;
}
.copied { font-size: 13px; color: var(--wa); }

/* sticky order bar */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-inner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.sum { flex: 1; min-width: 0; }
.sum .count { font-size: 13px; color: var(--muted); }
.sum .total { font-family: var(--font-display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.order {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  background: var(--wa); color: var(--wa-ink); font-weight: 600; font-size: 16px;
  padding: 12px 20px; border-radius: 999px; white-space: nowrap;
}
.order svg { width: 20px; height: 20px; fill: currentColor; }
.order[aria-disabled="true"] { opacity: .4; pointer-events: none; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

@media (max-width: 380px) {
  .item { grid-template-columns: 52px 1fr; }
  .donut { width: 52px; height: 52px; }
  .donut .band { inset: 21px 0 auto; }
  .stepper { grid-column: 1 / -1; justify-content: flex-end; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top-row">
      <div class="candles" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span class="shamash"></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-fr" data-lang="fr" aria-label="Français">
          <svg class="flag" viewBox="0 0 3 2" aria-hidden="true"><rect width="1" height="2" fill="#0055a4"/><rect x="1" width="1" height="2" fill="#ffffff"/><rect x="2" width="1" height="2" fill="#ef4135"/></svg>FR
        </button>
        <button type="button" id="lang-en" data-lang="en" aria-label="English">
          <svg class="flag" viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukS"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ukT"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#ukS)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#ffffff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukT)" stroke="#c8102e" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#ffffff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6"/></g></svg>EN
        </button>
        <button type="button" id="lang-he" data-lang="he" aria-label="עברית">
          <svg class="flag" viewBox="0 0 22 16" aria-hidden="true"><rect width="22" height="16" fill="#ffffff"/><rect y="1.5" width="22" height="2.5" fill="#0038b8"/><rect y="12" width="22" height="2.5" fill="#0038b8"/><g fill="none" stroke="#0038b8" stroke-width=".8"><path d="M11,4.6 L14.4,10.4 L7.6,10.4 Z"/><path d="M11,11.4 L7.6,5.6 L14.4,5.6 Z"/></g></svg>עב
        </button>
      </div>
    </div>
    <h1 data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
    <span class="price-tag" id="priceTag"></span>
  </header>

  <ul class="list" id="list"></ul>

  <section class="details">
    <h2 data-t="details"></h2>
    <div class="field">
      <label for="custName" data-t="name"></label>
      <input id="custName" type="text" autocomplete="name">
    </div>
    <div class="field">
      <label for="pickup" data-t="pickup"></label>
      <input id="pickup" type="text">
    </div>
    <div class="field">
      <label for="notes" data-t="notes"></label>
      <textarea id="notes"></textarea>
    </div>
  </section>

</div>

<div class="bar">
  <div class="bar-inner">
    <div class="sum">
      <div class="count" id="count"></div>
      <div class="total" id="total"></div>
    </div>
    <a class="order" id="order" href="#" target="_blank" rel="noopener" aria-disabled="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.3Z"/></svg>
      <span data-t="order"></span>
    </a>
  </div>
</div>

<script>
/* ===== Edit these to set up your shop ===== */
const CONFIG = {
  // Your WhatsApp number in international format, digits only (e.g. "972501234567").
  whatsappNumber: "972537087987",
  defaultLang: "fr",
  price: 12,            // price per sufganiya, in shekels
  flavors: [
    { id: "jam", glaze: "#c0283d", style: "dollop", sugar: true,
      name: { fr: "Confiture de fraise", en: "Strawberry jam", he: "ריבת תות" },
      desc: { fr: "La classique, saupoudrée de sucre glace", en: "The classic, dusted with powdered sugar", he: "הקלאסית, עם אבקת סוכר" } },
    { id: "dulce", glaze: "#a8662a",
      name: { fr: "Dulce de leche", en: "Dulce de leche", he: "דולסה דה לצ'ה" },
      desc: { fr: "Garniture et glaçage caramel", en: "Caramel filling, caramel glaze", he: "מילוי וציפוי קרמל" } },
    { id: "pistachio", glaze: "#8bb04a",
      name: { fr: "Crème pistache", en: "Pistachio cream", he: "קרם פיסטוק" },
      desc: { fr: "Crème pistache et éclats de pistache", en: "Pistachio cream and crushed nuts", he: "קרם פיסטוק ופיסטוקים קצוצים" } },
    { id: "choc", glaze: "#4a2a1a",
      name: { fr: "Chocolat", en: "Chocolate", he: "שוקולד" },
      desc: { fr: "Crème chocolat et ganache", en: "Chocolate cream and ganache top", he: "קרם שוקולד וציפוי גנאש" } },
    { id: "vanilla", glaze: "#f3ead2",
      name: { fr: "Crème vanille", en: "Vanilla custard", he: "קרם וניל" },
      desc: { fr: "Crème pâtissière, glaçage blanc", en: "Crème pâtissière, white glaze", he: "קרם פטיסייר, ציפוי לבן" } },
    { id: "lotus", glaze: "#c08547",
      name: { fr: "Lotus", en: "Lotus", he: "לוטוס" },
      desc: { fr: "Pâte Lotus et éclats de biscuit", en: "Biscoff spread and cookie crumbs", he: "ממרח לוטוס ופירורי עוגיות" } }
  ]
};
/* ========================================== */

const T = {
  fr: {
    title: "Sufganiyot de Hanoukka",
    sub: "Choisissez vos parfums et quantités, puis appuyez sur Commander. WhatsApp s'ouvre avec votre commande déjà rédigée, prête à envoyer.",
    each: p => `${p} la pièce`,
    details: "Vos coordonnées", name: "Nom", namePh: "Votre nom",
    pickup: "Jour de retrait", pickupPh: "ex. dimanche 6 décembre",
    notes: "Remarques", notesPh: "Une précision ?",
    preview: "Votre commande", copy: "Copier la commande", copied: "Copiée",
    hint: "Si WhatsApp ne s'ouvre pas, copiez la commande et envoyez-la vous-même.",
    none: "Rien de sélectionné", count: n => `${n} sufganiyot`, order: "Commander",
    add: n => `Ajouter : ${n}`, remove: n => `Retirer : ${n}`,
    money: n => `${n} ₪`,
    msgHello: "Bonjour ! Je voudrais commander des sufganiyot pour Hanoukka 🍩",
    msgTotal: (n, m) => `Total : ${n} sufganiyot, ${m}`,
    msgName: "Nom", msgPickup: "Retrait", msgNotes: "Remarques", sep: " : ",
    msgThanks: "Merci ! Hag Saméa'h 🕎"
  },
  en: {
    title: "Hanukkah Sufganiyot",
    sub: "Pick your flavors and quantities, then tap Order. WhatsApp opens with your order written out, ready to send.",
    each: p => `${p} each`,
    details: "Your details", name: "Name", namePh: "Your name",
    pickup: "Pickup day", pickupPh: "e.g. Sunday, 6 Dec",
    notes: "Notes", notesPh: "Anything we should know",
    preview: "Your order", copy: "Copy order", copied: "Copied",
    hint: "If WhatsApp doesn't open, copy the order and send it yourself.",
    none: "Nothing selected yet", count: n => `${n} sufganiyot`, order: "Order",
    add: n => `Add one ${n}`, remove: n => `Remove one ${n}`,
    money: n => `₪${n}`,
    msgHello: "Hi! I'd like to order sufganiyot for Hanukkah 🍩",
    msgTotal: (n, m) => `Total: ${n} sufganiyot, ${m}`,
    msgName: "Name", msgPickup: "Pickup", msgNotes: "Notes", sep: ": ",
    msgThanks: "Thank you! Chag Sameach 🕎"
  },
  he: {
    title: "סופגניות לחנוכה",
    sub: "בחרו טעמים וכמויות ולחצו על הזמנה. וואטסאפ ייפתח עם ההזמנה כתובה ומוכנה לשליחה.",
    each: p => `${p} ליחידה`,
    details: "הפרטים שלך", name: "שם", namePh: "השם שלך",
    pickup: "יום איסוף", pickupPh: "למשל: יום ראשון, 6 בדצמבר",
    notes: "הערות", notesPh: "משהו שחשוב שנדע",
    preview: "ההזמנה שלך", copy: "העתקת ההזמנה", copied: "הועתק",
    hint: "אם וואטסאפ לא נפתח, העתיקו את ההזמנה ושלחו אותה בעצמכם.",
    none: "עוד לא נבחר כלום", count: n => `${n} סופגניות`, order: "הזמנה",
    add: n => `הוספת ${n}`, remove: n => `הסרת ${n}`,
    money: n => `₪${n}`,
    msgHello: "שלום! אשמח להזמין סופגניות לחנוכה 🍩",
    msgTotal: (n, m) => `סה״כ: ${n} סופגניות, ${m}`,
    msgName: "שם", msgPickup: "איסוף", msgNotes: "הערות", sep: ": ",
    msgThanks: "תודה! חג שמח 🕎"
  }
};

const qty = Object.fromEntries(CONFIG.flavors.map(f => [f.id, 0]));
const $ = id => document.getElementById(id);
let lang = CONFIG.defaultLang;
try { const saved = localStorage.getItem("sufganiyot-lang"); if (T[saved]) lang = saved; } catch (e) {}
const t = () => T[lang];

const list = $("list");
CONFIG.flavors.forEach(f => {
  const li = document.createElement("li");
  li.className = "item";
  li.id = "item-" + f.id;
  li.innerHTML = `
    <div class="donut" style="--glaze:${f.glaze}" aria-hidden="true">
      ${f.sugar ? '<div class="sugar"></div>' : '<div class="band"></div>'}
      <div class="top ${f.style === "dollop" ? "dollop" : ""}"></div>
    </div>
    <div class="info">
      <p class="name"></p>
      <p class="desc"></p>
    </div>
    <div class="stepper">
      <button type="button" class="minus" id="minus-${f.id}" disabled>−</button>
      <span class="qty" id="qty-${f.id}" aria-live="polite">0</span>
      <button type="button" class="plus" id="plus-${f.id}">+</button>
    </div>`;
  list.appendChild(li);
  li.querySelector(".minus").addEventListener("click", () => change(f.id, -1));
  li.querySelector(".plus").addEventListener("click", () => change(f.id, +1));
});

["custName", "pickup", "notes"].forEach(id => $(id).addEventListener("input", render));
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

function change(id, d) {
  qty[id] = Math.max(0, Math.min(99, qty[id] + d));
  render();
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("sufganiyot-lang", l); } catch (e) {}
  applyLang();
  render();
}

function applyLang() {
  const L = t();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
  document.title = L.title;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = L[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("priceTag").textContent = L.each(L.money(CONFIG.price));
  $("custName").placeholder = L.namePh;
  $("pickup").placeholder = L.pickupPh;
  $("notes").placeholder = L.notesPh;
  CONFIG.flavors.forEach(f => {
    const li = $("item-" + f.id);
    li.querySelector(".name").textContent = f.name[lang];
    li.querySelector(".desc").textContent = f.desc[lang];
    $("minus-" + f.id).setAttribute("aria-label", L.remove(f.name[lang]));
    $("plus-" + f.id).setAttribute("aria-label", L.add(f.name[lang]));
  });
}

function buildMessage() {
  const L = t();
  const lines = [L.msgHello, ""];
  let count = 0;
  CONFIG.flavors.forEach(f => {
    const q = qty[f.id];
    if (!q) return;
    count += q;
    lines.push(`• ${q} × ${f.name[lang]}${L.sep}${L.money(q * CONFIG.price)}`);
  });
  lines.push("", L.msgTotal(count, L.money(count * CONFIG.price)));
  const name = $("custName").value.trim();
  const pickup = $("pickup").value.trim();
  const notes = $("notes").value.trim();
  if (name || pickup || notes) lines.push("");
  if (name) lines.push(L.msgName + L.sep + name);
  if (pickup) lines.push(L.msgPickup + L.sep + pickup);
  if (notes) lines.push(L.msgNotes + L.sep + notes);
  lines.push("", L.msgThanks);
  return lines.join("\n");
}

function render() {
  const L = t();
  let count = 0;
  CONFIG.flavors.forEach(f => {
    const q = qty[f.id];
    count += q;
    $("qty-" + f.id).textContent = q;
    $("minus-" + f.id).disabled = q === 0;
    $("item-" + f.id).classList.toggle("on", q > 0);
  });
  $("count").textContent = count ? L.count(count) : L.none;
  $("total").textContent = L.money(count * CONFIG.price);

  const order = $("order");
  if (count) {
    const msg = buildMessage();
    const num = CONFIG.whatsappNumber.replace(/\D/g, "");
    order.href = `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
    order.setAttribute("aria-disabled", "false");
  } else {
    order.href = "#";
    order.setAttribute("aria-disabled", "true");
  }
}

applyLang();
render();
</script>
</body>
</html>
